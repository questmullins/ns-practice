name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build course content
        run: |
          python3 content/build_content.py
          node content/export_challenges.js

      - name: Test Code Lab challenges
        run: node codelab-tests/run-tests.js

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NS-Practice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NS-Practice-apk
          path: NS-Practice.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NS Practice 1.0.${{ github.run_number }}
          body: |
            Download **NS-Practice.apk** below on your Android phone and open it to install. It adds two icons: NS Practice (study) and NS Code Lab (write SuiteScript).
            Built from ${{ github.sha }}.
          files: NS-Practice.apk
          make_latest: true
